<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Ridbanan</title><link rel="stylesheet" href="style.css?v=20261006-2316"></head><body>
<header><b>Ridbanan</b><span id="summary"></span><div><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">+</button></div></header>
<main><nav><select id="arenaSize"><option value="20,40">20 × 40 m</option><option value="20,60">20 × 60 m</option><option value="30,50">30 × 50 m</option></select><button id="rotate">↻ Rotera: AV</button><button id="duplicate">Kopiera</button><button id="remove">Ta bort</button></nav>
<div class="workspace"><section id="viewport"><div id="stage"><div id="arena"><div class="grid"></div><svg id="route" viewBox="0 0 1000 2000" preserveAspectRatio="none"></svg><i id="widthLabel"></i><i id="lengthLabel"></i></div></div></section>
<aside><h5>VALT HINDER</h5><div class="card"><h3 id="selectedTitle"></h3><label id="heightField">Höjd<select id="heightSelect"></select></label><label id="oxerWidthField">Oxerbredd<select id="oxerWidthSelect"><option>.5</option><option>.7</option><option>.9</option><option>1.1</option><option>1.3</option><option>1.5</option></select></label></div>
<h5>LÄGG TILL</h5><button class="add" data-add="rail">━　Räcke <small>3,0 m</small></button><button class="add" data-add="oxer">═　Oxer <small>3,0 m</small></button><button class="add" data-add="groundpole">━　Markbom <small>3,0 m</small></button><button class="add" data-add="cone"><em>▲</em>　Kon</button>
<h5>VISNING</h5><button id="hideMeasures">Mått: PÅ</button><button id="edgeMeasures">Kantmått valt: AV</button><button id="toggleNumbers">Hindernummer: PÅ</button><button id="toggleRoute">Ridväg: PÅ</button>
<h5>RIDVÄG</h5><button id="drawRoute">✎ Rita ridväg: AV</button><button id="clearRoute">Rensa ridväg</button><p>Dra hela ridvägen med fingret i en sammanhängande rörelse.</p></aside></div></main><script src="app.js?v=20261006-2316"></script></body></html>
