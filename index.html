<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Ridbana</title><link rel="stylesheet" href="style.css"></head><body><header><div><strong>Ridbana</strong><span id="summary">20 × 40 m</span></div><div class="zoom"><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">+</button></div></header><main><section class="toolbar"><select id="arenaSize"><option value="20,40">20 × 40 m</option><option value="20,60">20 × 60 m</option><option value="30,50">30 × 50 m</option></select><button data-add="rail">+ Räcke</button><button data-add="oxer">+ Oxer</button><button data-add="wall">+ Mur</button><button data-add="water">+ Vatten</button><button id="rotate">↻ Rotera</button><button id="edgeMeasures">📐 Kantmått: AV</button><button id="duplicate">Duplicera</button><button id="remove">Ta bort</button></section><section id="viewport"><div id="stage"><div id="arena"><div class="grid"></div><svg id="route" viewBox="0 0 1000 2000" preserveAspectRatio="none"></svg><div class="dimension width" id="widthLabel">20 m</div><div class="dimension length" id="lengthLabel">40 m</div></div></div></section><footer><span>Tryck och dra hinder, START eller MÅL.</span><span>Kantmått är av som standard och kan slås på per hinder.</span></footer></main><script src="app.js"></script></body></html>
