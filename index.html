<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ridbanan</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar">
  <div class="brand">Ridbanan <span id="summary">20 × 40 m</span></div>
  <div class="top-actions"><button id="zoomOut">−</button><span id="zoomText">100%</span><button id="zoomIn">+</button></div>
</header>
<main>
<section class="toolbar">
  <select id="arenaSize"><option value="20,40">20 × 40 m</option><option value="20,60">20 × 60 m</option><option value="30,50">30 × 50 m</option></select>
  <button data-add="rail">+ Räcke</button><button data-add="oxer">+ Oxer</button><button data-add="groundpole">+ Markbom</button>
  <button id="rotate">↻ Rotera: AV</button><button id="edgeMeasures">📐 Kantmått: AV</button><button id="duplicate">Kopiera</button><button id="remove">Ta bort</button>
</section>
<div class="workspace">
  <section id="viewport"><div id="stage"><div id="arena"><div class="grid"></div><svg id="route" viewBox="0 0 1000 2000" preserveAspectRatio="none"></svg><div class="dimension width" id="widthLabel">20 m</div><div class="dimension length" id="lengthLabel">40 m</div></div></div></section>
  <aside id="panel">
    <div class="tabs"><button class="active">Hinder</button><button>Bana</button></div>
    <div id="selectionCard">
      <h3 id="selectedTitle">Räcke 1</h3>
      <div class="field" id="heightField"><label>Höjd</label><select id="heightSelect"></select></div>
      <div class="field" id="oxerWidthField"><label>Oxerbredd</label><select id="oxerWidthSelect"><option value="0.5">0,5 m</option><option value="0.7">0,7 m</option><option value="0.9">0,9 m</option><option value="1.1">1,1 m</option><option value="1.3">1,3 m</option><option value="1.5">1,5 m</option></select></div>
      <div class="spec"><span>Hinderbredd</span><strong>3,0 m</strong></div>
    </div>
    <h4>Lägg till hinder</h4>
    <button class="obstacle-card" data-add="rail"><span class="preview rail-preview"></span><b>Räcke</b><small>3,0 m</small></button>
    <button class="obstacle-card" data-add="oxer"><span class="preview oxer-preview"></span><b>Oxer</b><small>3,0 m</small></button>
    <button class="obstacle-card" data-add="groundpole"><span class="preview ground-preview"></span><b>Markbom</b><small>3,0 m</small></button>
  </aside>
</div>
<footer>Markera ett hinder för inställningar. Rotera PÅ = dra med ett finger runt hindret.</footer>
</main><script src="app.js"></script></body></html>
